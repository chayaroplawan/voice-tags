<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Non-verbal Voice Tags</title>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#111;--line:#2a2a2a;--muted:#929292;--accent:#d6ff3f}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1a1a 0,#090909 38%);color:#f4f4f4;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1240px;margin:auto;padding:48px 22px 60px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}
    h1{margin:0;font-size:clamp(2rem,5vw,4.8rem);letter-spacing:-.06em;line-height:.95}header p{margin:10px 0 0;color:var(--muted);font-size:.98rem}.count{color:var(--accent);font-weight:700;font-size:1.1rem;white-space:nowrap}
    .toolbar{display:flex;gap:10px;margin:22px 0 14px}.search{width:100%;background:#151515;border:1px solid var(--line);border-radius:10px;color:#fff;padding:13px 15px;font-size:1rem;outline:none}.search:focus{border-color:var(--accent)}
    .table-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto;background:rgba(17,17,17,.88)}table{width:100%;border-collapse:collapse;min-width:780px}
    th,td{padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:#a7a7a7;text-transform:uppercase;font-size:.72rem;letter-spacing:.14em;background:#151515;position:sticky;top:0;z-index:1}
    tbody tr:hover{background:#191919}tbody tr:last-child td{border-bottom:0}td:first-child{color:var(--accent);font-variant-numeric:tabular-nums;width:70px;font-weight:700}td:nth-child(2){font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#fff;width:260px}.meaning{color:#c6c6c6}
    .audio{display:flex;gap:8px;flex-wrap:wrap}.audio audio{width:190px;height:32px;filter:invert(1) hue-rotate(180deg) saturate(.7)}footer{margin-top:16px;color:#686868;font-size:.8rem}
    @media(max-width:700px){main{padding:28px 14px 40px}header{display:block}.count{display:block;margin-top:18px}.audio audio{width:170px}}
  </style>
</head>
<body><main>
  <header><div><h1>Voice Tags</h1><p>Non-verbal sound library · 63 sounds</p></div><div class="count" id="count"></div></header>
  <div class="toolbar"><input id="search" class="search" type="search" placeholder="ค้นหา ID, ชื่อเสียง หรือคำอธิบาย..." aria-label="ค้นหา"></div>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Original</th><th>ลักษณะเสียง</th><th>ตัวอย่างเสียง</th></tr></thead><tbody id="rows"></tbody></table></div>
  <footer>เสียง 1 และ 2 เล่นจากไฟล์ต้นฉบับในโฟลเดอร์ Non-verbal Tags</footer>
</main>
<script src="data.js"></script><script>
const rows=document.querySelector('#rows'),search=document.querySelector('#search'),count=document.querySelector('#count');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const file=(id,name,n)=>'audio/'+id+'_'+name+'_'+n+'.mp3';
function render(){const q=search.value.trim().toLowerCase();const visible=VOICE_TAGS.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));count.textContent=visible.length+' / '+VOICE_TAGS.length+' รายการ';rows.innerHTML=visible.map(r=>{const id=r.ID,name=r['ชื่อเสียง (Original)'],meaning=r['ลักษณะเสียง (ของเดิม)'];return '<tr><td>'+id+'</td><td>'+esc(name)+'</td><td class="meaning">'+esc(meaning)+'</td><td><div class="audio">'+[1,2].map(n=>'<audio controls preload="none" src="'+encodeURI(file(id,name,n))+'" aria-label="'+esc(name)+' เสียง '+n+'"></audio>').join('')+'</div></td></tr>'}).join('')}
search.addEventListener('input',render);render();
</script></body></html>
